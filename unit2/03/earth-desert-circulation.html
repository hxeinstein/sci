<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대기 대순환과 위도 30° 사막</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F5F9FA;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
</style>
</head>
<body>
<main>
<canvas id="cv" role="button" tabindex="0" aria-label="대기 대순환 애니메이션. 누르면 일시정지하거나 재생합니다"></canvas>
</main>
<script>
const VW=800,VH=600;
const cv=document.getElementById('cv');cv.width=VW*2;cv.height=VH*2;
const c=cv.getContext('2d');
const F="'Do Hyeon',sans-serif";
const INK='#24324A',TEAL='#1F7A7A',DOWN='#D9822B',UP='#2F7DC4';
const TOP=130,GND=420,EQ=400,N30=665,S30=135;
let T=0,paused=false,last=performance.now();
cv.addEventListener('click',()=>{paused=!paused;});
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cv.click();}});
// loop path for a cell: from x=a (equator side) to x=b (30° side)
function cellPt(a,b,s){ // s in [0,1)
  const yT=TOP+28,yB=GND-22,H=yB-yT,Wd=Math.abs(b-a),P=2*H+2*Wd,d=s*P,dir=Math.sign(b-a);
  if(d<H) return [a,yB-d,'up'];
  if(d<H+Wd) return [a+dir*(d-H),yT,'top'];
  if(d<2*H+Wd) return [b,yT+(d-H-Wd),'down'];
  return [b-dir*(d-2*H-Wd),yB,'bot'];
}
const P=[];for(const cell of [[EQ+22,N30],[EQ-22,S30]])for(let i=0;i<26;i++)P.push({cell,s:i/26});
const rain=[];for(let i=0;i<26;i++)rain.push({x:EQ-45+Math.random()*90,y:200+Math.random()*190,v:180+Math.random()*80});
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function arrowHead(x,y,ang,col,s){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=col;c.beginPath();c.moveTo(s,0);c.lineTo(-s,-s*0.8);c.lineTo(-s,s*0.8);c.closePath();c.fill();c.restore();}
function sun(x,y){c.save();c.translate(x,y);c.rotate(T*0.4);c.strokeStyle='#F2A922';c.lineWidth=3;
  for(let i=0;i<8;i++){c.rotate(Math.PI/4);c.beginPath();c.moveTo(19,0);c.lineTo(27,0);c.stroke();}
  c.restore();c.fillStyle='#FFC83A';c.beginPath();c.arc(x,y,15,0,7);c.fill();}
function cloud(x,y){c.fillStyle='#fff';c.strokeStyle='#9fb2c6';c.lineWidth=2;c.beginPath();
  c.arc(x-34,y+6,20,0,7);c.arc(x-10,y-10,27,0,7);c.arc(x+20,y-4,24,0,7);c.arc(x+40,y+8,17,0,7);c.fill();c.stroke();
  c.fillStyle='#fff';c.fillRect(x-50,y+6,96,20);}
function update(dt){for(const p of P)p.s=(p.s+dt*0.055)%1;for(const r of rain){r.y+=r.v*dt;if(r.y>GND-4)r.y=215+Math.random()*30;}}
function draw(){
  c.setTransform(2,0,0,2,0,0);c.textBaseline='middle';
  c.fillStyle='#F5F9FA';c.fillRect(0,0,VW,VH);
  c.fillStyle=INK;c.font="31px "+F;c.textAlign='center';c.fillText('위도 30° 부근에 사막이 많은 까닭',VW/2,30);
  // sky
  const g=c.createLinearGradient(0,TOP,0,GND);g.addColorStop(0,'#DCEAF6');g.addColorStop(1,'#F3F8FC');
  c.fillStyle=g;c.fillRect(40,TOP-60,720,GND-TOP+60);
  // ground: desert near 30°, green near equator
  const gg=c.createLinearGradient(40,0,760,0);
  gg.addColorStop(0,'#E3C27F');gg.addColorStop(0.2,'#E3C27F');gg.addColorStop(0.38,'#8DBB6A');gg.addColorStop(0.5,'#5E9E4E');
  gg.addColorStop(0.62,'#8DBB6A');gg.addColorStop(0.8,'#E3C27F');gg.addColorStop(1,'#E3C27F');
  c.fillStyle=gg;c.fillRect(40,GND,720,26);
  // dunes
  c.fillStyle='#D9B36A';for(const x0 of [S30,N30]){for(const dx of [-40,0,40]){c.beginPath();c.ellipse(x0+dx,GND,26,11,0,Math.PI,0);c.fill();}}
  // trees at equator
  for(const dx of [-60,-30,30,60]){const x=EQ+dx;c.fillStyle='#6b4a2e';c.fillRect(x-2,GND-14,4,14);c.fillStyle='#3E8A3E';c.beginPath();c.arc(x,GND-18,10,0,7);c.fill();}
  // cell guide loops
  for(const [a,b] of [[EQ+22,N30],[EQ-22,S30]]){
    c.strokeStyle='rgba(47,125,196,0.35)';c.lineWidth=3;c.setLineDash([8,8]);c.lineDashOffset=-T*30;
    const yT=TOP+28,yB=GND-22;c.beginPath();c.moveTo(a,yB);c.lineTo(a,yT);c.lineTo(b,yT);c.lineTo(b,yB);c.closePath();c.stroke();c.setLineDash([]);
    const d=Math.sign(b-a);
    arrowHead(a,(yT+yB)/2,-Math.PI/2,UP,13);arrowHead((a+b)/2,yT,d>0?0:Math.PI,'#5d7da0',11);
    arrowHead(b,(yT+yB)/2,Math.PI/2,DOWN,13);arrowHead((a+b)/2,yB,d>0?Math.PI:0,'#5d7da0',11);
  }
  // particles
  for(const p of P){const[x,y,seg]=cellPt(p.cell[0],p.cell[1],p.s);
    c.fillStyle=seg==='up'?UP:seg==='down'?DOWN:'#7f93ab';c.beginPath();c.arc(x,y,4.5,0,7);c.fill();}
  // equator cloud & rain
  c.strokeStyle='rgba(47,125,196,0.7)';c.lineWidth=2;for(const r of rain){c.beginPath();c.moveTo(r.x,r.y);c.lineTo(r.x-2,r.y+9);c.stroke();}
  cloud(EQ,190);
  // suns over 30°
  sun(S30,TOP-26);sun(N30,TOP-26);
  // labels
  label(EQ,TOP-28,'상승 기류',UP);
  label(N30-82,GND-60,'하강 기류',DOWN);label(S30+82,GND-60,'하강 기류',DOWN);
  label(N30-80,TOP-26,'맑고 건조',DOWN);label(S30+80,TOP-26,'맑고 건조',DOWN);
  c.fillStyle='#8a6a2c';c.font="21px "+F;c.textAlign='center';c.fillText('사막',N30+50,GND-34);c.fillText('사막',S30-50,GND-34);
  // latitude ticks
  c.fillStyle=INK;c.font="19px "+F;
  for(const [x,t] of [[S30,'위도 30°S'],[EQ,'적도 (0°)'],[N30,'위도 30°N']]){c.fillRect(x-1,GND+26,2,8);c.fillText(t,x,GND+46);}
  c.fillStyle='#8a97a8';c.font="15px "+F;c.textAlign='center';c.fillText('(적도~위도 30° 구간만 단순하게 그림)',VW/2,57);
  // info
  c.fillStyle='#fff';rr(30,476,740,120,14);c.fill();c.strokeStyle='#cfd8e2';c.lineWidth=1.5;c.stroke();
  c.textAlign='left';c.font="19px "+F;
  c.fillStyle=TEAL;c.fillText('대기 대순환',48,498);
  c.fillStyle=INK;c.fillText(': 위도에 따른 에너지 불균형과 지구 자전에 의해 생기는',150,498);
  c.fillText('  지구 전체 규모의 순환',150,522);
  c.fillStyle=DOWN;c.fillText('위도 30° 부근',48,550);
  c.fillStyle=INK;c.fillText(': 하강 기류 형성 → 맑고 건조한 날씨 지속 → 사막 분포',160,550);
  c.fillStyle='#5b6b80';c.font="16px "+F;c.fillText('※ 사막화 : 주변 지역의 토지가 황폐해지면서 점차 사막으로 변하는 현상',48,578);
  if(paused){c.fillStyle='rgba(36,50,74,0.8)';rr(VW-188,8,180,32,10);c.fill();c.fillStyle='#fff';c.font="17px "+F;c.textAlign='center';c.fillText('일시정지 · 클릭하면 재생',VW-98,25);}
}
function label(x,y,t,col){c.font="19px "+F;const w=c.measureText(t).width+20;c.fillStyle=col;rr(x-w/2,y-14,w,28,14);c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText(t,x,y+1);}
function loop(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;if(!paused){T+=dt;update(dt);}draw();requestAnimationFrame(loop);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
</body>
</html>
