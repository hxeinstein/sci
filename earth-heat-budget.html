<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지구의 열수지와 이산화 탄소 증가</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F5F9FA;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const VW=800,VH=600;
const cv=document.getElementById('cv');cv.width=VW*2;cv.height=VH*2;
const c=cv.getContext('2d');
const F="'Do Hyeon',sans-serif";
const INK='#24324A',TEAL='#1F7A7A',SUN='#F2A922',IR='#E0533D';
const SP_T=96,SP_B=150,AT_B=362,GR_B=402;
let mode=0,modeT=0,k=0,T=0,paused=false,last=performance.now();
const tabs=[{x:235,y:50,w:155,h:34,label:'열수지 평형',m:0},{x:410,y:50,w:155,h:34,label:'CO₂ 농도 증가',m:1}];
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),s=Math.min(r.width/VW,r.height/VH);
  const x=(e.clientX-r.left-(r.width-VW*s)/2)/s,y=(e.clientY-r.top-(r.height-VH*s)/2)/s;
  for(const t of tabs){if(x>t.x&&x<t.x+t.w&&y>t.y&&y<t.y+t.h){mode=t.m;modeT=0;paused=false;return;}}
  paused=!paused;
});
// arrows: points, value, color, label position
const A=[
 {id:'in',  v:100,col:SUN,p:[[330,SP_T+4],[330,182]],head:false},
 {id:'r25', v:25, col:SUN,p:[[312,182],[232,262],[192,SP_T+22]]},
 {id:'r5',  v:5,  col:SUN,p:[[300,182],[150,392],[118,SP_T+22]]},
 {id:'a20', v:20, col:SUN,p:[[348,182],[428,252]]},
 {id:'s50', v:50, col:SUN,p:[[330,182],[330,392]]},
 {id:'e132',v:132,col:IR, p:[[612,396],[612,236]]},
 {id:'d94', v:94, col:IR, p:[[520,240],[520,392]]},
 {id:'o58', v:58, col:IR, p:[[538,236],[566,SP_T+22]]},
 {id:'o12', v:12, col:IR, p:[[690,396],[742,SP_T+22]]},
];
const LBL={r25:[262,214,'25'],r5:[196,300,'5'],a20:[412,214,'20'],s50:[306,330,'50'],
 e132:[672,330,'132'],d94:[556,300,'94'],o58:[574,180,'58'],o12:[735,250,'12']};
function W(a){let w=Math.max(4,a.v*0.3);if(a.id==='e132'||a.id==='d94')w*=1+0.45*k*(0.85+0.15*Math.sin(T*4));return w;}
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function pathArrow(a){
  const w=W(a),p=a.p;
  c.lineJoin='round';c.lineCap='butt';c.strokeStyle=a.col;c.lineWidth=w;c.globalAlpha=0.85;
  const n=p.length,[x1,y1]=p[n-2],[x2,y2]=p[n-1],L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
  const hl=a.head===false?0:Math.max(12,w*0.9);
  c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++)c.lineTo(p[i][0],p[i][1]);
  c.lineTo(x2-ux*hl,y2-uy*hl);c.stroke();
  if(hl){const hw=Math.max(10,w*0.95);c.fillStyle=a.col;c.beginPath();c.moveTo(x2,y2);
    c.lineTo(x2-ux*hl-uy*hw,y2-uy*hl+ux*hw);c.lineTo(x2-ux*hl+uy*hw,y2-uy*hl-ux*hw);c.closePath();c.fill();}
  // flowing dashes
  c.globalAlpha=0.75;c.strokeStyle='#fff';c.lineWidth=Math.max(1.5,w*0.18);c.setLineDash([6,14]);c.lineDashOffset=-T*45;
  c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++)c.lineTo(p[i][0],p[i][1]);c.lineTo(x2-ux*hl,y2-uy*hl);c.stroke();
  c.setLineDash([]);c.globalAlpha=1;
}
function cloud(x,y,s){c.fillStyle='rgba(255,255,255,0.95)';c.strokeStyle='#b8c6d6';c.lineWidth=1.5;
  c.beginPath();c.arc(x-16*s,y+3*s,13*s,0,7);c.arc(x,y-6*s,17*s,0,7);c.arc(x+18*s,y+3*s,13*s,0,7);c.fill();c.stroke();
  c.fillStyle=INK;c.font=(15*s)+"px "+F;c.textAlign='center';c.textBaseline='middle';c.fillText('구름',x,y);}
function co2(x,y,a){c.globalAlpha=a;c.fillStyle='#5a6475';c.beginPath();c.arc(x,y,6,0,7);c.fill();
  c.fillStyle='#e05a4a';c.beginPath();c.arc(x-10,y,5,0,7);c.arc(x+10,y,5,0,7);c.fill();c.globalAlpha=1;}
const CO=[[120,180],[460,330],[700,190],[250,330],[560,300],[420,160],[740,320],[170,240],[660,260],[470,195]];
function update(dt){modeT+=dt;if(modeT>12){mode=1-mode;modeT=0;}k+=((mode?1:0)-k)*Math.min(1,dt*2.2);}
function draw(){
  c.setTransform(2,0,0,2,0,0);c.textBaseline='middle';
  c.fillStyle='#F5F9FA';c.fillRect(0,0,VW,VH);
  c.fillStyle=INK;c.font="32px "+F;c.textAlign='center';c.fillText('지구의 열수지',VW/2,25);
  for(const t of tabs){const on=mode===t.m;rr(t.x,t.y,t.w,t.h,17);c.fillStyle=on?TEAL:'#fff';c.fill();
    c.strokeStyle=TEAL;c.lineWidth=2;c.stroke();c.fillStyle=on?'#fff':TEAL;c.font="20px "+F;c.fillText(t.label,t.x+t.w/2,t.y+t.h/2+1);}
  // bands
  c.fillStyle='#D3EAF5';c.fillRect(80,SP_T,700,SP_B-SP_T);
  c.fillStyle='#EAF4FA';c.fillRect(80,SP_B,700,AT_B-SP_B);
  const gr=Math.round(232-20*k);c.fillStyle=`rgb(240,${gr},${Math.round(220-40*k)})`;c.fillRect(80,AT_B,700,GR_B-AT_B);
  c.strokeStyle='#c4d3df';c.lineWidth=1;c.strokeRect(80,SP_T,700,GR_B-SP_T);
  c.fillStyle='#e9eef3';c.fillRect(20,SP_T,60,GR_B-SP_T);
  c.fillStyle=INK;c.font="19px "+F;c.textAlign='center';
  c.fillText('우주',50,(SP_T+SP_B)/2);c.fillText('대기',50,(SP_B+AT_B)/2);c.fillText('지표',50,(AT_B+GR_B)/2);
  // CO2 molecules
  if(k>0.02)for(let i=0;i<CO.length;i++){const[x,y]=CO[i];co2(x+Math.sin(T+i)*5,y+Math.cos(T*0.8+i)*4,k);}
  for(const a of A)pathArrow(a);
  cloud(232,262,1);cloud(452,246,1);
  // labels
  c.font="19px "+F;
  for(const a of A){if(!LBL[a.id])continue;const[x,y,t]=LBL[a.id];c.fillStyle='rgba(255,255,255,0.85)';rr(x-19,y-12,38,24,8);c.fill();
    c.fillStyle=a.col===SUN?'#9A6400':'#B23A27';c.textAlign='center';c.fillText(t,x,y+1);}
  c.font="17px "+F;
  for(const [t,x] of [['태양 복사 100',330],['반사 30',155],['지구 복사 70',655]]){const w=c.measureText(t).width+14;
    c.fillStyle='rgba(255,255,255,0.92)';rr(x-w/2,SP_T+1,w,22,8);c.fill();c.fillStyle=INK;c.fillText(t,x,SP_T+12);}
  c.font="15px "+F;c.fillStyle='#5b6b80';
  c.fillText('지표 흡수',330,GR_B+12);c.fillText('대기 복사 흡수',520,GR_B+12);c.fillText('지표 방출',612,GR_B+12);
  // phase-2 change tags
  if(k>0.05){c.globalAlpha=k;
    tag(640,205,'132보다 증가 ↑');tag(445,352,'94보다 증가 ↑');
    c.fillStyle='#8a97a8';c.font="14px "+F;c.textAlign='right';c.fillText('(변화를 크게 그림)',776,GR_B+12);
    c.globalAlpha=1;}
  // bottom panel
  if(mode===0) table(); else chain();
  if(paused){c.fillStyle='rgba(36,50,74,0.8)';rr(VW-188,8,180,32,10);c.fill();c.fillStyle='#fff';c.font="17px "+F;c.textAlign='center';c.fillText('일시정지 · 클릭하면 재생',VW-98,25);}
}
function tag(x,y,t){c.font="18px "+F;const w=c.measureText(t).width+18;c.fillStyle=IR;rr(x-w/2,y-14,w,28,14);c.fill();
  c.fillStyle='#fff';c.textAlign='center';c.fillText(t,x,y+1);}
function table(){
  const x0=110,y0=428,cw=[150,150,150,130],rh=40,hd=['구분','지표','대기','우주'],r1=['유입되는 에너지양','144','152','100'],r2=['유출되는 에너지양','144','152','100'];
  let x=x0;[hd,r1,r2].forEach((row,ri)=>{x=x0;row.forEach((t,ci)=>{
    rr(x+3,y0+ri*rh+3,cw[ci]-6,rh-6,10);c.fillStyle=ri===0?'#DCEBEA':(ci===0?'#eef2f6':'#fff');c.fill();
    c.fillStyle=ri===0?TEAL:INK;c.font=(ci===0&&ri>0?"18px ":"21px ")+F;c.textAlign='center';c.fillText(t,x+cw[ci]/2,y0+ri*rh+rh/2+1);x+=cw[ci];});});
  c.fillStyle='rgba(36,50,74,0.92)';rr(110,556,580,36,10);c.fill();
  c.fillStyle='#fff';c.font="20px "+F;c.fillText('평형 상태 : 지구가 흡수하는 에너지양 = 방출하는 에너지양',VW/2,575);
}
function chain(){
  const items=[['대기 중','이산화 탄소','농도 증가'],['대기가 흡수하는','에너지양','132보다 증가'],['대기가 지표로','방출하는 에너지양','94보다 증가'],['지표가 다시','흡수하는 에너지양','94보다 증가'],['지표 온도','상승']];
  const n=items.length,bw=140,gap=16,x0=(VW-(n*bw+(n-1)*gap))/2,y=440,h=100;
  const step=Math.min(n,Math.floor(modeT/1.3)+1);
  items.forEach((it,i)=>{const x=x0+i*(bw+gap),on=i<step;
    rr(x,y,bw,h,14);c.fillStyle=on?(i===n-1?IR:'#fff'):'#eef1f4';c.fill();c.strokeStyle=on?IR:'#cfd8e2';c.lineWidth=2;c.stroke();
    c.fillStyle=on?(i===n-1?'#fff':INK):'#a7b2bf';c.font=(i===n-1?"22px ":"17px ")+F;c.textAlign='center';
    const L=it.length;it.forEach((tx,j)=>c.fillText(tx,x+bw/2,y+h/2+(j-(L-1)/2)*(i===n-1?28:24)));
    if(i<n-1){c.fillStyle=i+1<step?IR:'#cfd8e2';const ax=x+bw+3;c.beginPath();c.moveTo(ax,y+h/2-8);c.lineTo(ax+gap-6,y+h/2);c.lineTo(ax,y+h/2+8);c.fill();}});
  c.fillStyle=INK;c.font="19px "+F;c.textAlign='center';c.fillText('대기 중 이산화 탄소 농도가 증가하면 지구 열수지는 어떻게 변할까?',VW/2,570);
}
function loop(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;if(!paused){T+=dt;update(dt);}draw();requestAnimationFrame(loop);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
</body>
</html>
